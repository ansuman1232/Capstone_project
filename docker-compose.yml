services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - 8000:8000
   
  frontend:
     build: ./frontend
     ports:
      - 5173:5173
     tty:
       true
  redis:
    image: redis:7-alpine
    container_name: redis-container
    ports:
      - 6379:6379
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
volumes:
  redis-data: